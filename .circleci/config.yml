version: 2.1

orbs:
  docker: circleci/docker@2.2

jobs:
  build:
    docker:
      - image: cimg/php:8.3
        environment:
          APP_ENV: testing
          DB_CONNECTION: sqlite
    steps:
      - checkout
      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
      - run:
          name: Install dependencies
          command: composer install --no-interaction --prefer-dist --no-scripts
      - save_cache:
          paths:
            - vendor
          key: composer-v1-{{ checksum "composer.lock" }}
      - run:
          name: Generate app key for testing
          command: php artisan key:generate --env=testing
      - run:
          name: Prepare testing database
          command: |
            php artisan migrate --env=testing --force
      - run:
          name: Run tests
          command: php artisan test --env=testing
  docker-build-push-dev:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            IMAGE_NAME=$DOCKERHUB_USERNAME/tambah-udang
            docker build -f docker/Dockerfile -t $IMAGE_NAME:${CIRCLE_SHA1} .
            docker tag $IMAGE_NAME:${CIRCLE_SHA1} $IMAGE_NAME:development
      - run:
          name: Push image to Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker push $DOCKERHUB_USERNAME/tambah-udang:${CIRCLE_SHA1}
            docker push $DOCKERHUB_USERNAME/tambah-udang:development

workflows:
  build_and_push_dev:
    jobs:
      - build
      - docker-build-push-dev:
          requires:
            - build
          filters:
            branches:
              only: development   # <-- hanya jalan kalau branch development
